<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITRE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&family=Alegreya:ital,wght@0,400;0,600;1,400&family=IM+Fell+English+SC&display=swap">
<style>
/* =====================================================================
   APPARENCE DU JEU — tout l'habillage se règle ici, dans ces variables.
   ===================================================================== */
:root {
  --fond: #131116;
  --fond-lueur: #2a2230;
  --surface: #1b1820;
  --surface-2: #231f29;
  --bande: #17151b;
  --trait: #383241;
  --trait-doux: #2c2732;
  --texte: #e8e1d2;
  --texte-recit: #e3dccd;
  --texte-doux: #9d9486;
  --texte-pale: #6f6878;
  --ivoire: #dccba4;
  --ivoire-encre: #1a1714;
  --thanergie: #84c0b2;
  --sang: #c0503f;
  --sang-clair: #e27461;
  --mousse: #93b376;
  --or: #c9a44d;
  --police-titre: 'IM Fell English SC', 'Iowan Old Style', Georgia, serif;
  --police-recit: 'Alegreya', 'Iowan Old Style', Georgia, serif;
  --police-ui: 'Alegreya Sans', 'Segoe UI', system-ui, sans-serif;
  --taille-recit: 20px;
  --largeur-lecture: 680px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--fond); color: var(--texte); font-family: var(--police-ui); font-size: 16px; line-height: 1.5; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--thanergie); outline-offset: 2px; }
[hidden] { display: none !important; }
.wrap { min-height: 100%; display: flex; flex-direction: column; }
.pad { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Boutons */
.b-prim { display: inline-flex; justify-content: center; align-items: center; gap: 8px; padding: 13px 26px; background: var(--ivoire); color: var(--ivoire-encre); border: 0; border-radius: 4px; font-weight: 700; font-size: 17px; text-decoration: none; }
.b-prim:hover { filter: brightness(1.06); }
.b-prim:disabled { opacity: .45; cursor: not-allowed; }
.b-sec { display: inline-flex; justify-content: center; align-items: center; padding: 10px 18px; background: transparent; border: 1px solid #4a4252; border-radius: 4px; color: var(--texte); font-size: 15px; }
.b-sec:hover { border-color: var(--ivoire); }
.b-lien { background: none; border: 0; color: var(--texte-doux); padding: 8px 4px; font-size: 15px; }
.b-lien:hover { color: var(--texte); }
.titre-f { font-family: var(--police-titre); font-weight: 400; color: var(--ivoire); }
.label { font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--texte-doux); font-weight: 500; margin: 0; }

/* Page de titre */
.ecran-titre { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px; text-align: center; padding-block: 48px; background: radial-gradient(ellipse 70% 60% at 50% 30%, var(--fond-lueur) 0%, var(--fond) 70%); }
.ecran-titre h1 { margin: 0; font-size: clamp(44px, 8vw, 84px); line-height: 1; text-wrap: balance; }
.ornement { display: flex; align-items: center; gap: 14px; justify-content: center; }
.ornement span { display: block; width: 90px; height: 1px; background: #5a5262; }
.ornement i { display: block; width: 8px; height: 8px; border: 1px solid var(--thanergie); transform: rotate(45deg); }
.accroche { margin: 0; max-width: 560px; font-family: var(--police-recit); font-style: italic; font-size: 21px; color: #c9c0b0; }
.menu { display: flex; flex-direction: column; gap: 10px; width: min(380px, 100%); }
.menu .b-sec { flex-direction: column; gap: 2px; }
.menu small { color: var(--texte-doux); font-size: 13px; }
.pied { font-size: 13px; color: var(--texte-pale); }

/* Création */
.entete { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 24px; padding-block: 18px; border-bottom: 1px solid var(--trait-doux); }
.entete .titre-f { font-size: 22px; }
.etapes { display: flex; flex-wrap: wrap; gap: 6px 22px; margin: 0; padding: 0; list-style: none; font-size: 14px; color: var(--texte-pale); }
.etapes li[aria-current="step"] { color: var(--ivoire); font-weight: 700; }
.etapes li.fait { color: var(--texte-doux); }
.creation { flex: 1; width: 100%; max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 26px; padding-block: 30px; }
.creation h2 { margin: 0; font-size: clamp(32px, 4vw, 44px); }
.sous { margin: 0; font-family: var(--police-recit); font-style: italic; font-size: 19px; color: #b8af9f; }
.champ input { width: min(320px, 100%); padding: 10px 14px; background: var(--surface); border: 1px solid #4a4252; border-radius: 4px; font-family: var(--police-recit); font-size: 20px; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg button { padding: 10px 20px; background: transparent; border: 1px solid #4a4252; border-radius: 4px; font-size: 16px; }
.seg button[aria-pressed="true"] { background: #22302d; border: 1.5px solid var(--thanergie); font-weight: 700; }
.cartes { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 190px), 1fr)); gap: 12px; }
.carte { text-align: left; display: flex; flex-direction: column; gap: 8px; padding: 16px; background: var(--surface); border: 1px solid var(--trait); border-radius: 6px; }
.carte[aria-pressed="true"] { background: #22302d; border: 1.5px solid var(--thanergie); }
.carte .nom { font-family: var(--police-titre); font-size: 20px; color: var(--ivoire); line-height: 1.15; }
.carte .desc { font-size: 14px; line-height: 1.45; color: #b8af9f; }
.carte .jeu { margin-top: auto; font-size: 13px; color: var(--thanergie); }
.detail { display: flex; flex-direction: column; gap: 10px; padding: 20px 22px; background: var(--surface); border: 1px solid var(--trait); border-radius: 6px; }
.detail h3 { margin: 0; font-size: 28px; }
.detail p { margin: 0; font-family: var(--police-recit); font-size: 18px; line-height: 1.6; color: #d6cebf; }
.detail .infos { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 15px; color: #b8af9f; }
.detail .infos b { color: var(--texte); }
.carac { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 10px; }
.carac > div { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 14px 16px; background: var(--surface); border-radius: 6px; }
.carac b { font-size: 17px; }
.carac .val { font-size: 24px; font-weight: 700; color: var(--ivoire); text-align: right; }
.carac .val small { font-size: 13px; font-weight: 400; color: var(--thanergie); }
.carac .expl { grid-column: 1 / -1; font-size: 13.5px; color: var(--texte-doux); }
.derives { display: flex; flex-wrap: wrap; gap: 10px 28px; padding: 14px 16px; background: var(--surface); border-radius: 6px; }
.derives div { text-align: center; }
.derives b { display: block; font-size: 21px; }
.derives span { font-size: 13px; color: var(--texte-doux); }
.navcrea { display: flex; justify-content: space-between; align-items: center; padding-block: 18px 28px; width: 100%; max-width: 1100px; margin: 0 auto; }
.crime { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 48px; align-items: start; }
@media (max-width: 860px) { .crime { grid-template-columns: minmax(0, 1fr); gap: 28px; } }
.avis { margin: 0; font-size: 13px; letter-spacing: .24em; text-transform: uppercase; color: var(--sang); }
.recit { font-family: var(--police-recit); font-size: var(--taille-recit); line-height: 1.7; color: var(--texte-recit); }
.recit p { margin: 0 0 .75em; }
.recit p:last-child { margin-bottom: 0; }

/* Fiche résumée */
.fiche-mini { display: flex; flex-direction: column; gap: 12px; padding: 20px 22px; background: var(--surface); border: 1px solid var(--trait); border-radius: 6px; }
.fiche-mini h3 { margin: 0; font-size: 26px; }
.grille6 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; text-align: center; }
.grille6 div { padding: 8px; background: var(--surface-2); border-radius: 4px; }
.grille6 b { display: block; font-size: 20px; }
.grille6 span { font-size: 12.5px; color: var(--texte-doux); }

/* Jeu */
.barre { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 22px; padding-block: 12px; background: var(--bande); border-bottom: 1px solid var(--trait-doux); }
.barre .titre-f { font-size: 20px; }
.barre .acte { font-size: 14px; color: var(--texte-doux); }
.barre .stats { margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; font-size: 14px; }
.jauge { display: inline-flex; align-items: center; gap: 8px; }
.jauge .t { color: var(--texte-doux); }
.jauge .j { display: block; width: 100px; height: 7px; background: var(--trait-doux); border-radius: 4px; overflow: hidden; }
.jauge .j i { display: block; height: 100%; background: var(--sang); transition: width .4s; }
.jauge.mana .j i { background: var(--thanergie); }
.jauge.lum .j i { background: var(--lumiere, #c9973a); }
.jauge.lum.bas .j i { background: var(--sang); animation: vacille 1.6s ease-in-out infinite; }
.jauge.lum.bas b { color: #d4553d; }
@keyframes vacille { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
.usure b { color: var(--or); }
.lecture { flex: 1; width: 100%; max-width: var(--largeur-lecture); margin: 0 auto; display: flex; flex-direction: column; gap: 18px; padding-block: 26px 48px; }
.illus { width: 100%; border-radius: 6px; display: block; }
.numero { display: flex; align-items: center; justify-content: center; gap: 16px; }
.numero span { display: block; width: 60px; height: 1px; background: var(--trait); }
.numero b { font-family: var(--police-titre); font-weight: 400; font-size: 34px; color: var(--ivoire); line-height: 1; }
.gains { margin: 0; font-size: 14px; color: var(--thanergie); }
.choix { display: flex; flex-direction: column; gap: 8px; padding-top: 6px; }
.choix button { display: flex; align-items: center; gap: 12px; text-align: left; padding: 12px 16px; min-height: 48px; border: 1px solid var(--trait); border-radius: 5px; background: var(--surface); font-family: var(--police-recit); font-size: 18px; }
.choix button:hover:not(:disabled) { border-color: var(--ivoire); }
.choix button::before { content: "➤"; color: var(--ivoire); }
.choix .bloque { display: flex; flex-direction: column; gap: 3px; padding: 12px 16px; border: 1px dashed var(--trait-doux); border-radius: 5px; color: var(--texte-pale); font-family: var(--police-recit); font-size: 18px; }
.choix .bloque s { text-decoration-thickness: 1px; }
.choix .bloque em { font-family: var(--police-ui); font-size: 14px; }
.test { display: flex; flex-wrap: wrap; align-items: center; gap: 24px 32px; padding: 24px 28px; background: var(--surface); border: 1px solid var(--trait); border-radius: 6px; }
.de { position: relative; width: 110px; height: 110px; flex: none; }
.de svg { width: 100%; height: 100%; }
.de b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 38px; }
.de.roule { animation: roule .6s ease-out; }
@keyframes roule { from { transform: rotate(-200deg) scale(.5); opacity: 0; } to { transform: none; opacity: 1; } }
.test .res { display: flex; flex-direction: column; gap: 6px; }
.test .verdict { font-family: var(--police-titre); font-size: 32px; }
.ok { color: var(--mousse); } .ko { color: var(--sang-clair); } .mag { color: var(--thanergie); }

/* Fenêtres */
.voile { position: fixed; inset: 0; z-index: 50; background: rgba(8, 7, 10, .72); display: flex; align-items: center; justify-content: center; padding: 20px max(12px, env(safe-area-inset-right, 0px)) 20px max(12px, env(safe-area-inset-left, 0px)); }
.fenetre { width: 100%; max-width: 1000px; max-height: calc(100vh - 40px); overflow: auto; background: var(--surface); border: 1px solid #4a4252; border-radius: 10px; box-shadow: 0 30px 80px rgba(0, 0, 0, .6); display: flex; flex-direction: column; }
.fenetre > header { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 22px; border-bottom: 1px solid var(--trait-doux); position: sticky; top: 0; background: var(--surface); z-index: 1; }
.fenetre > header h2 { margin: 0; font-size: 26px; }
.fenetre .corps { padding: 18px 22px 22px; }
.combat { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 22px; }
@media (max-width: 760px) { .combat { grid-template-columns: minmax(0, 1fr); } }
.groupe { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 8px; margin-bottom: 14px; }
.groupe .foe { display: flex; flex-direction: column; align-items: stretch; gap: 3px; text-align: left; padding: 8px 10px; background: #18161c; border: 1px solid var(--trait); border-radius: 5px; color: var(--texte); cursor: pointer; font: inherit; }
.groupe .foe .n { display: flex; justify-content: space-between; gap: 6px; align-items: baseline; }
.groupe .foe b { font-size: 15px; }
.groupe .foe small { font-size: 12.5px; color: var(--texte-doux); }
.groupe .foe .role { text-transform: uppercase; letter-spacing: .08em; font-size: 10.5px; color: var(--or, #c9a45a); }
.groupe .foe .j { display: block; height: 6px; background: var(--trait-doux); overflow: hidden; }
.groupe .foe .j i { display: block; height: 100%; background: var(--sang); }
.groupe .foe.sel { border-color: var(--ivoire); box-shadow: 0 0 0 1px var(--ivoire) inset; }
.groupe .foe .cible { color: var(--ivoire); font-weight: 700; letter-spacing: .06em; }
.groupe .foe.mort { opacity: .4; cursor: default; }
.best-dl { margin: 16px 0 0; display: flex; flex-direction: column; gap: 10px; }
.best-dl dt { color: var(--texte-doux); margin: 0 0 2px; }
.best-dl dd { margin: 0; font-size: 17px; }
.best-nouv { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; margin: 10px 0; }
.combat .zone { margin: 0 0 8px; color: var(--texte-doux); }
.groupe.seul { grid-template-columns: 1fr; }
.groupe .foe { position: relative; }
.groupe.seul .foe b { font-family: var(--police-titre); font-weight: 400; font-size: 24px; color: var(--ivoire); }
.groupe .foe .geste { align-self: flex-start; margin-top: 2px; font-size: 12.5px; padding: 1px 6px; border: 1px dashed var(--trait); color: var(--texte-doux); }
.groupe .foe .geste.lu { border-style: solid; color: var(--texte); }
.groupe .foe .geste.it-lourd, .groupe .foe .geste.it-incant { border-color: var(--sang-clair); color: var(--sang-clair); }
.groupe .foe .geste.it-garde, .groupe .foe .geste.it-entrave { border-color: var(--thanergie); color: var(--thanergie); }
.groupe .foe .geste.it-soutien { border-color: var(--or, #c9a45a); color: var(--or, #c9a45a); }
.heros { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 8px 18px; align-items: center; margin: 14px 0 0; padding: 10px 12px; border: 1px solid var(--trait); background: rgba(0,0,0,.25); }
.heros .id { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.heros .id b { font-size: 18px; color: var(--ivoire); }
.heros .id small { font-size: 12.5px; color: var(--texte-doux); }
.heros .id .rage { color: var(--sang-clair); font-weight: 700; letter-spacing: .08em; }
.heros .jauges { display: flex; flex-direction: column; gap: 6px; }
.ligne-j { display: grid; grid-template-columns: 62px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.ligne-j .t { font-size: 11.5px; color: var(--texte-doux); text-transform: uppercase; letter-spacing: .06em; }
.ligne-j b { font-size: 13.5px; white-space: nowrap; }
.ligne-j .j { display: block; height: 10px; background: var(--trait-doux); overflow: hidden; }
.ligne-j .j i { display: block; height: 100%; transition: width .4s; }
.ligne-j.vie .j i, .jauge.vie .j i { background-color: var(--ivoire) !important; }
.ligne-j.vie.bas .j i, .jauge.vie.bas .j i { background-color: var(--sang-clair) !important; animation: vacille 1.2s ease-in-out infinite; }
.ligne-j.vie.bas b, .jauge.vie.bas b { color: var(--sang-clair); }
.ligne-j.mana .j i { background-color: var(--thanergie); }
.groupe .foe .j i { background-color: var(--sang); }
@media (max-width: 640px) { .heros { grid-template-columns: 1fr; } }
.duel { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.duel .n { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.duel .n b { font-family: var(--police-titre); font-weight: 400; font-size: 21px; color: var(--ivoire); }
.duel .j { display: block; height: 8px; background: var(--trait-doux); border-radius: 4px; overflow: hidden; margin: 6px 0 4px; }
.duel .j i { display: block; height: 100%; background: var(--sang); transition: width .4s; }
.duel small { font-size: 13.5px; color: var(--texte-doux); }
.intention { margin-top: 14px; padding: 16px 20px; background: var(--surface-2); border-left: 3px solid var(--ivoire); border-radius: 0 6px 6px 0; }
.intention p { margin: 6px 0 0; font-family: var(--police-recit); font-style: italic; font-size: 22px; line-height: 1.45; }
.aide { margin-top: 6px; font-size: 14px; color: var(--thanergie); }
.actions { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr)); gap: 8px; margin-top: 14px; }
.actions button { text-align: left; padding: 10px 12px; background: #18161c; border: 1px solid var(--trait); border-radius: 5px; }
.actions button:hover:not(:disabled) { border-color: var(--ivoire); }
.actions button:disabled { opacity: .4; cursor: not-allowed; }
.actions b { display: block; font-size: 16px; }
.actions small { font-size: 13px; color: var(--texte-doux); }
.actions .mot b { color: var(--thanergie); }
.actions .obs b { color: var(--ivoire); }
.journal { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; background: var(--bande); border: 1px solid var(--trait-doux); border-radius: 6px; max-height: 420px; overflow: auto; }
.journal ol { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; font-size: 14px; line-height: 1.45; color: #b8af9f; }
.journal li:first-child { color: var(--texte); }
.dé { display: inline-flex; align-items: center; justify-content: center; min-width: 1.7em; height: 1.7em; padding: 0 3px; border: 1.5px solid currentColor; border-radius: 4px; font-weight: 700; margin-right: 4px; }
.victoire { margin-top: 14px; display: flex; flex-direction: column; gap: 12px; }
.victoire p { margin: 0; font-family: var(--police-recit); font-size: 19px; }
.engager { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding-top: 6px; }
.engager .label { color: var(--sang-clair); }
.engager.parler .label { color: var(--texte-doux); }
.dialogue .pnj-desc { margin: 0 0 12px; color: var(--texte-doux); font-style: italic; font-family: var(--police-recit); font-size: 17px; line-height: 1.5; }
.dialogue .pnj-desc p { margin: 0 0 6px; }
.dispo { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.dispo .j { flex: 0 1 160px; height: 8px; background: #18161c; border: 1px solid var(--trait); display: block; }
.dispo .j i { display: block; height: 100%; background: var(--ivoire); }
.dispo b { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; }
.dialogue .toi { margin: 14px 0 0; color: var(--texte-doux); font-family: var(--police-recit); font-size: 18px; }
.replique .paroles { margin-top: 6px; font-family: var(--police-recit); font-style: italic; font-size: 21px; line-height: 1.45; }
.replique .paroles p { margin: 0 0 8px; }
.replique .paroles p:last-child { margin: 0; }
.reponses { margin-top: 14px; }
.reponses button { font-size: 17px; }
.reponses button > span { display: flex; flex-direction: column; gap: 2px; }
.reponses .tags { font-family: var(--police-ui); font-size: 12.5px; letter-spacing: .04em; color: var(--or, #c9a45a); }
.reponses .bloque .tags { color: inherit; }
.reponses button.deja { opacity: .72; }
.reponses button.conge { background: transparent; color: var(--texte-doux); }
.reponses button.conge::before { content: "◀"; }
.sujets .liste-sujets { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.sujets .liste-sujets button { text-align: left; font-size: 14.5px; padding: 3px 0; }
.sujets .liste-sujets button.deja { opacity: .6; }
.sujets .liste-sujets button.actif { color: var(--ivoire); font-weight: 700; opacity: 1; }
.butin { border: 1px solid var(--trait); border-radius: 6px; padding: 10px 14px; background: var(--surface); }
.butin ul { margin: 6px 0 0; padding-left: 18px; font-family: var(--police-recit); font-size: 17px; }

/* Fiche complète */
.fiche { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; }
@media (max-width: 860px) { .fiche { grid-template-columns: minmax(0, 1fr); } }
.fiche section { display: flex; flex-direction: column; gap: 12px; padding: 4px 22px 18px; border-right: 1px solid var(--trait-doux); }
.fiche section:last-child { border-right: 0; }
.ligne { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 12px; background: var(--surface-2); border-radius: 5px; }
.ligne small { display: block; font-size: 13px; color: var(--texte-doux); }
.pastille { font-size: 12.5px; color: var(--thanergie); border: 1px solid #3f5f58; border-radius: 99px; padding: 2px 9px; background: none; }
.usure-boite { display: flex; flex-direction: column; gap: 6px; padding: 14px; border: 1px solid #4a3f24; border-radius: 6px; background: #1f1b17; }
.usure-boite p { margin: 0; font-size: 14px; color: #b8af9f; }
.mot-carte { padding: 12px 14px; border: 1px solid #3f5f58; border-radius: 6px; background: #1a2422; }
.mot-carte p { margin: 6px 0 0; font-family: var(--police-recit); font-size: 16px; color: #c9c0b0; }
.savoirs { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; font-family: var(--police-recit); font-size: 16px; color: #c9c0b0; }
.vide { color: var(--texte-pale); font-size: 14px; }

/* Mort, fin */
.ecran-mort { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; text-align: center; padding-block: 48px; background: radial-gradient(ellipse 60% 55% at 50% 45%, #2a1416 0%, #0d0b0e 75%); }
.ecran-mort h1 { margin: 0; font-size: clamp(56px, 9vw, 88px); line-height: 1; color: var(--sang-clair); }
.ecran-fin { flex: 1; width: 100%; max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 56px; padding-block: 56px; align-items: start; }
@media (max-width: 860px) { .ecran-fin { grid-template-columns: minmax(0, 1fr); gap: 32px; padding-block: 32px; } }
.ecran-fin h1 { margin: 0; font-size: clamp(38px, 5vw, 58px); line-height: 1.05; }
.fins { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.fins li { padding: 8px 12px; border: 1px solid var(--trait); border-radius: 5px; }
.fins li.frag-ok { padding: 0; }
.frag-lien { display: block; width: 100%; text-align: left; background: none; border: 0; color: var(--ivoire); font: inherit; padding: 8px 12px; cursor: pointer; }
.frag-lien:hover, .frag-lien:focus-visible { background: rgba(255,255,255,.04); }
.frag-nouv { margin: 8px 0 0; padding: 6px 14px; font-size: 14px; }
.frag-texte { font-size: var(--taille-recit, 20px); }
.fins li.cachee { border-style: dashed; border-color: var(--trait-doux); color: #5a5262; }
.fins li.actuelle { border-color: #5c5234; color: var(--ivoire); }
.bilan { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding-top: 16px; border-top: 1px solid var(--trait-doux); }
.bilan b { display: block; font-size: 22px; }
.bilan span { font-size: 13.5px; color: var(--texte-doux); }
.panneau { display: flex; flex-direction: column; gap: 20px; padding: 22px 24px; background: var(--surface); border: 1px solid var(--trait); border-radius: 6px; }

@media (max-width: 640px) {
  .barre .stats { margin-left: 0; width: 100%; }
  .jauge .j { width: 70px; }
  :root { --taille-recit: 18px; }
}
@media (prefers-reduced-motion: reduce) { .de.roule, .jauge.lum.bas .j i { animation: none; } .jauge .j i, .duel .j i { transition: none; } }
</style>

/* =====================================================================
   THÈME « CRYPTE 4 TONS » — gothique façon donjon, contraintes de console portable
   4 tons principaux + 2 accents (sang, thanergie), pixels nets, pas d'arrondis.
   ===================================================================== */
:root {
  --fond: #0d0a0b;          /* ton 1 : nuit */
  --fond-lueur: #2b1a16;
  --surface: #17110f;       /* ton 2 : pierre sombre */
  --surface-2: #211814;
  --bande: #120d0c;
  --trait: #5c4636;         /* ton 3 : bronze terni */
  --trait-doux: #33261f;
  --texte: #e4d3a8;         /* ton 4 : os */
  --texte-recit: #e4d3a8;
  --texte-doux: #a08a63;
  --texte-pale: #6e5c45;
  --ivoire: #efdcae;
  --ivoire-encre: #140e0b;
  --thanergie: #7fb08a;     /* accent : lueur des morts */
  --sang: #a3261a;          /* accent : sang */
  --sang-clair: #d6482f;
  --mousse: #9fb86a;
  --or: #d39a3a;
  --lumiere: #e8a33c;
  --police-titre: 'Jacquard 12', 'IM Fell English SC', serif;
  --police-recit: 'Pixelify Sans', 'Alegreya', serif;
  --police-ui: 'Pixelify Sans', 'Segoe UI', sans-serif;
  --taille-recit: 21px;
  --px: 3px;                /* taille d'un « pixel » de bordure */
}
html { -webkit-font-smoothing: none; font-smooth: never; }
body {
  background-color: var(--fond);
  /* trame tramée (dithering) très discrète + vignette de torche */
  background-image:
    radial-gradient(ellipse 75% 65% at 50% 38%, rgba(232,163,60,.07), rgba(0,0,0,0) 60%),
    radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.65) 100%),
    repeating-conic-gradient(rgba(255,240,200,.022) 0 25%, transparent 0 50%);
  background-size: auto, auto, 4px 4px;
  background-attachment: fixed;
}
*, *::before, *::after { border-radius: 0 !important; }
img, .illus { image-rendering: pixelated; }
.titre-f { letter-spacing: .02em; text-shadow: var(--px) var(--px) 0 #000; }
.label { font-family: 'Silkscreen', var(--police-ui); font-size: 12px; letter-spacing: .12em; }

/* Bordures « pixel » : coins découpés en escalier */
.pix, .b-prim, .b-sec, .carte, .detail, .fiche-mini, .test, .choix button, .fenetre, .actions button, .journal, .panneau, .ligne, .mot-carte, .usure-boite, .butin, .intention, .seg button, .champ input {
  border: 0 !important;
  box-shadow:
    0 calc(-1 * var(--px)) 0 0 var(--bord, var(--trait)),
    0 var(--px) 0 0 var(--bord, var(--trait)),
    calc(-1 * var(--px)) 0 0 0 var(--bord, var(--trait)),
    var(--px) 0 0 0 var(--bord, var(--trait)) !important;
  margin: var(--px);
}
.carte, .detail, .fiche-mini, .test, .choix button, .actions button, .journal, .panneau, .ligne, .mot-carte, .usure-boite, .butin, .seg button, .champ input { --bord: var(--trait); }
.fenetre { --bord: var(--ivoire); box-shadow:
    0 calc(-1 * var(--px)) 0 0 var(--bord), 0 var(--px) 0 0 var(--bord), calc(-1 * var(--px)) 0 0 0 var(--bord), var(--px) 0 0 0 var(--bord),
    0 0 0 calc(2 * var(--px)) #000, 0 30px 80px rgba(0,0,0,.7) !important; }

/* Boutons : curseur ▶ et inversion des couleurs au survol, comme un menu de console */
.b-prim { background: var(--ivoire); color: var(--ivoire-encre); --bord: #000; font-family: 'Silkscreen', var(--police-ui); font-size: 15px; letter-spacing: .06em; text-transform: uppercase; }
.b-prim:hover { filter: none; background: var(--lumiere); }
.b-sec { --bord: var(--trait); font-family: 'Silkscreen', var(--police-ui); font-size: 13px; letter-spacing: .05em; text-transform: uppercase; }
.b-sec:hover { --bord: var(--ivoire); background: var(--surface-2); }
.choix button { font-family: var(--police-recit); font-size: 19px; background: var(--surface); }
.choix button::before { content: "▶"; color: transparent; text-shadow: 0 0 0 var(--trait); font-size: 13px; }
.choix button:hover:not(:disabled), .choix button:focus-visible { background: var(--ivoire); color: var(--ivoire-encre); --bord: var(--ivoire); outline: none; }
.choix button:hover::before, .choix button:focus-visible::before { text-shadow: 0 0 0 var(--sang); animation: clignote .8s steps(1) infinite; }
@keyframes clignote { 50% { opacity: 0; } }
.choix .bloque { border: 0; box-shadow: none; background: repeating-linear-gradient(-45deg, transparent 0 6px, rgba(92,70,54,.25) 6px 9px); }

/* Titre */
.ecran-titre { background: transparent; }
.ecran-titre h1 { font-size: clamp(56px, 11vw, 120px); color: var(--ivoire); text-shadow: 4px 4px 0 var(--sang), 8px 8px 0 #000; }
.ornement span { height: var(--px); background: var(--trait); }
.ornement i { border: 0; background: var(--sang); width: 9px; height: 9px; }
.accroche { font-style: normal; color: var(--texte-doux); }

/* Barre du haut : jauges segmentées */
.barre { background: #0a0807; border-bottom: var(--px) solid var(--trait-doux); }
.jauge .t, .usure .t { font-family: 'Silkscreen', var(--police-ui); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
.jauge .j, .duel .j, .ligne-j .j, .groupe .foe .j { height: 12px; background: #000; box-shadow: 0 0 0 2px var(--trait); }
.jauge .j i, .duel .j i, .ligne-j .j i, .groupe .foe .j i { background-image: repeating-linear-gradient(90deg, rgba(0,0,0,0) 0 7px, #000 7px 9px) !important; transition: width .4s steps(6); }
.jauge .j i { background-color: var(--sang); }
.jauge.mana .j i { background-color: var(--thanergie); }
.jauge.lum .j i { background-color: var(--lumiere); }

/* Récit */
.recit { line-height: 1.55; text-shadow: 1px 1px 0 #000; }
.numero b { font-size: 46px; color: var(--sang-clair); text-shadow: 3px 3px 0 #000; }
.numero span { height: var(--px); background: var(--trait); }
.gains { font-family: 'Silkscreen', var(--police-ui); font-size: 12px; letter-spacing: .03em; color: var(--thanergie); }

/* Dé : hexagone plein, chiffres pixel */
.de b { font-family: 'Silkscreen', var(--police-ui); font-size: 30px; }
.test .verdict { font-size: 40px; }

/* Combat */
.fenetre { background: var(--surface); }
.fenetre > header { background: #0a0807; border-bottom: var(--px) solid var(--trait-doux); }
.intention { --bord: var(--sang); background: #1c100d; border-left: 0; }
.intention p { font-style: normal; font-size: 22px; }
.actions button { background: #0f0b0a; }
.actions button:hover:not(:disabled) { --bord: var(--ivoire); background: var(--surface-2); }
.actions b { font-family: 'Silkscreen', var(--police-ui); font-size: 13px; text-transform: uppercase; letter-spacing: .04em; }
.dé { border-width: 2px; }
.voile { background: rgba(5,4,4,.82); }

/* Écran de mort : rouge sang, à la manière d'une épitaphe */
.ecran-mort { background: radial-gradient(ellipse 55% 50% at 50% 45%, #3a0d09 0%, #070505 75%); }
.ecran-mort h1 { color: var(--sang-clair); text-shadow: 4px 4px 0 #000; }
.carte[aria-pressed="true"], .seg button[aria-pressed="true"] { --bord: var(--thanergie); background: #18201b; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="calque"></div>
<script id="livre-data" type="application/json">__LIVRE_JSON__</script>
<script>
(function () {
  "use strict";
  var L = JSON.parse(document.getElementById("livre-data").textContent);
  var R = L.reglages || {};
  if (R.theme === "classique") { var th = document.getElementById("theme-crypte"); if (th) th.remove(); }
  R.origines = R.origines || []; R.occupations = R.occupations || [];
  L.passages = L.passages || {}; L.objets = L.objets || {}; L.mots = L.mots || {}; L.infos = L.infos || {}; L.fragments = L.fragments || {}; L.ennemis = L.ennemis || {}; L.pnj = L.pnj || {};
  var STATS = { for: "Force", hab: "Habileté", sag: "Sagesse", vig: "Vigueur", man: "Mana", cha: "Chance", lum: "Lumière" };
  function LUMMAX() { return Math.max(1, +R.lumMax || 10); }
  var INTENTS = { lourd: "Coup lourd", rapides: "Coups rapides", garde: "Garde basse", incant: "Incantation", soutien: "Soutien", entrave: "Entravé" };
  var EXPL = { for: "Frapper, parer, forcer une porte.", hab: "Esquiver, grimper, se faufiler.", sag: "Percevoir, comprendre, lire les gestes d'un ennemi." };
  var ACTES = ["", "I", "II", "III"];
  var CLE = "kepultum:" + (L.id || R.titre || "livre");
  var app = document.getElementById("app"), calque = document.getElementById("calque");

  /* ---------- Outils ---------- */
  function h(tag, attrs) {
    var el = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      var v = attrs[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "text") el.textContent = v;
      else if (k === "html") el.innerHTML = v;
      else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), v);
      else if (k === "value") el.value = v;
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (var i = 2; i < arguments.length; i++) add(el, arguments[i]);
    return el;
  }
  function add(el, c) {
    if (c === null || c === undefined || c === false) return;
    if (Array.isArray(c)) { c.forEach(function (x) { add(el, x); }); return; }
    el.appendChild(typeof c === "string" || typeof c === "number" ? document.createTextNode(String(c)) : c);
  }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function rnd(n) { return 1 + Math.floor(Math.random() * n); }
  function parseDice(s) {
    s = String(s || "").replace(/\s/g, "");
    var m = s.match(/^(\d*)d(\d+)([+-]\d+)?$/i);
    if (m) return [parseInt(m[1] || "1", 10), parseInt(m[2], 10), parseInt(m[3] || "0", 10)];
    var n = parseInt(s, 10); return [0, 0, isNaN(n) ? 0 : n];
  }
  function roll(spec) { var t = spec[2]; for (var i = 0; i < spec[0]; i++) t += rnd(spec[1]); return t; }
  function lines(s) { return String(s || "").split("\n").map(function (x) { return x.trim(); }).filter(Boolean); }
  function pick(a) { return a.length ? a[Math.floor(Math.random() * a.length)] : ""; }
  function store(k, v) { try { if (v === undefined) localStorage.removeItem(CLE + k); else localStorage.setItem(CLE + k, JSON.stringify(v)); } catch (e) {} }
  function load(k) { try { var v = localStorage.getItem(CLE + k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  function nomActe(a) { a = String(a || ""); if (!ACTES[+a]) return ""; var n = (R.actesNoms || {})[a]; return "Acte " + ACTES[+a] + (n ? " · " + n : ""); }

  /* ---------- Texte : nom, genre, mise en forme ---------- */
  function setupCourant() { return UI.ecran === "creation" ? UI.setup : P && P.setup; }
  function nomHeros() { var st = setupCourant(); return (st && String(st.nom || "").trim()) || String(R.nomDefaut || "").trim() || "Voyageur"; }
  function genre(text, g) {
    var st = setupCourant();
    g = g || (st && st.genre) || "m";
    text = String(text || "").replace(/\{nom\}/gi, nomHeros());
    text = text.replace(/\{([^{}]*\|[^{}]*)\}/g, function (_, inner) {
      var parts = inner.split("|");
      if (g === "f") return parts[1];
      if (g === "n") return parts.length > 2 ? parts[2] : parts[0];
      return parts[0];
    });
    if (g === "n") return text;
    var f = g === "f";
    text = text.replace(/([A-Za-zÀ-ÖØ-öø-ÿœŒæÆ'’-]+)·([A-Za-zÀ-ÖØ-öø-ÿœŒ]+)·([A-Za-zÀ-ÖØ-öø-ÿœŒ]+)/g, function (_, a, b, c) { return f ? a + b + c : a + c; });
    text = text.replace(/([A-Za-zÀ-ÖØ-öø-ÿœŒæÆ'’-]+)·([A-Za-zÀ-ÖØ-öø-ÿœŒ]+)/g, function (_, a, b) { return f ? a + b : a; });
    return text;
  }
  function riche(text, g) {
    return String(genre(text, g) || "").split(/\n\s*\n/).map(function (para) {
      var s = esc(para.trim()).replace(/\*([^*]+)\*/g, "<em>$1</em>").replace(/\n/g, "<br>");
      return s ? "<p>" + s + "</p>" : "";
    }).join("");
  }

  /* ---------- Personnage et règles ---------- */
  var P = null;
  var UI = { ecran: "titre", etape: 1, setup: null, modal: null };
  function occOf(n) { return (R.occupations || []).filter(function (o) { return o.nom === n; })[0] || { fav: [] }; }
  function bonusOrigine(o) { o = o || {}; return o.bonus === "aucun" ? "" : (o.bonus || (/(^|[^a-zà-ÿ])est nostra/i.test(o.nom || "") ? "debrouillard" : "")); }
  function debrouillard() { return !!P && bonusOrigine(origOf(P.setup.origine)) === "debrouillard"; }
  function origOf(n) { return (R.origines || []).filter(function (o) { return o.nom === n; })[0] || {}; }
  function nouveauPerso(setup) {
    var o = occOf(setup.occupation), fav = o.fav || [], r = setup.rolled;
    var s = { for: +r.for, hab: +r.hab, sag: +r.sag };
    ["for", "hab", "sag"].forEach(function (k) { if (fav.indexOf(k) >= 0) s[k] += 2; });
    s.vigMax = s.for + 6 + (fav.indexOf("vig") >= 0 ? 2 : 0);
    s.manMax = s.sag + 2 + (fav.indexOf("man") >= 0 ? 2 : 0);
    s.cp = s.for + 3 + (fav.indexOf("cp") >= 0 ? 2 : 0);
    s.vig = s.vigMax; s.man = s.manMax; s.cha = Math.floor(s.hab / 2);
    return { setup: setup, s: s, usure: 0, compteur: 0, inv: {}, eq: {}, mots: [], infos: [], frag: [], temp: [], vus: {}, cur: null, combat: null, test: null, fx: [], save: null, morts: 0, lus: 0 };
  }

  /* ---------- Talents d'occupation et familles d'arme ---------- */
  var TALENTS = {
    traitre: { nom: "Coup en traître", txt: "Ta contre-attaque après une esquive réussie fait ×3 au lieu de ×2." },
    pisteur: { nom: "Instinct du pisteur", txt: "Tu lis toujours les gestes d'un ennemi, même quand il les cache." },
    mur: { nom: "Mur de bouclier", txt: "Parer un coup lourd ne te coûte que le quart des dégâts ; parer des coups rapides donne +2 à ton prochain coup." },
    savoir: { nom: "Savoir ancien", txt: "Ton premier Mot de chaque combat coûte 2 Mana de moins." },
    rage: { nom: "Rage", txt: "Sous la moitié de ta Vigueur : +2 dégâts à chaque coup, mais plus de garde prudente." },
    main: { nom: "La main de l'Inconnu", txt: "Une fois par combat, un dé raté est relancé." }
  };
  var FAMILLES = {
    dague: { nom: "dague", txt: "Légère : +2 pour Esquiver." },
    epee: { nom: "épée", txt: "Équilibrée : +1 pour Frapper et pour Parer." },
    hache: { nom: "hache ou masse", txt: "Brise-garde : contre une garde basse, dégâts ×2." },
    lance: { nom: "lance", txt: "Allonge : contre des coups rapides, si tu touches, tu ne prends que la moitié des dégâts." },
    arc: { nom: "arc ou arbalète", txt: "À distance : un tir gratuit en ouvrant le combat, +3 pour interrompre une incantation, mais −2 pour Parer." },
    baton: { nom: "bâton", txt: "Canalisateur : +1 Mana à chaque coup qui touche." }
  };
  function devineFamille(nom) {
    var n = String(nom || "").toLowerCase();
    if (/arbal|(^|[^a-zà-ÿ])arcs?([^a-zà-ÿ]|$)/.test(n)) return "arc";
    if (/dague|poignard|couteau|surin/.test(n)) return "dague";
    if (/lance|pique|hallebarde|épieu/.test(n)) return "lance";
    if (/hache|masse|marteau|fléau|gourdin/.test(n)) return "hache";
    if (/bâton|baton/.test(n)) return "baton";
    if (/épée|epée|epee|sabre|lame|rapière/.test(n)) return "epee";
    return "";
  }
  function devineTalent(nom) {
    var n = String(nom || "").toLowerCase();
    if (/malandrin|couleuvre/.test(n)) return "traitre";
    if (/rôdeur|rodeur|cormoran/.test(n)) return "pisteur";
    if (/chevalier|héron/.test(n)) return "mur";
    if (/rainette/.test(n)) return "savoir";
    if (/sanglier/.test(n)) return "rage";
    if (/élu|inconnu/.test(n)) return "main";
    return "";
  }
  function talentDe(o) { o = o || {}; return o.talent === "aucun" ? "" : (o.talent || devineTalent(o.nom)); }
  function talent() { return talentDe(occOf(P.setup.occupation)); }
  function enRage() { return talent() === "rage" && P.s.vig <= eff("vigMax") / 2; }
  function equipes() { var out = []; if (!P) return out; ["arme", "armure", "talisman"].forEach(function (sl) { var id = P.eq[sl]; if (id && L.objets[id] && P.inv[id] > 0) out.push(L.objets[id]); }); return out; }
  function bonus(k) { return equipes().reduce(function (n, o) { return n + (o.bonus_stat === k ? (+o.bonus_val || 0) : 0); }, 0) + tempB(k); }
  /* Effets temporaires (objets) */
  var TEMP_LBL = { for: "Force", hab: "Habileté", sag: "Sagesse", cha: "Chance", vigMax: "Vigueur max", manMax: "Mana max", armure: "Armure", parade: "Parade", degats: "Dégâts" };
  function tempB(k) { return ((P && P.temp) || []).reduce(function (n, t) { return n + (t.stat === k ? t.n : 0); }, 0); }
  function tempTxt(t, sansNom) {
    var d = t.unite === "combat" ? "jusqu'à la fin du combat" : t.reste + " " + (t.unite === "tours" ? "tour" : "passage") + (t.reste > 1 ? "s" : "");
    return (sansNom ? "" : t.nom + " : ") + (t.n >= 0 ? "+" : "−") + Math.abs(t.n) + " " + (TEMP_LBL[t.stat] || t.stat) + " (" + d + ")";
  }
  function tempTick(unite) {
    var fin = [];
    P.temp = (P.temp || []).filter(function (t) {
      var stop = unite === "combat" ? (t.unite === "combat" || t.unite === "tours") : (t.unite === unite && --t.reste <= 0);
      if (stop) fin.push(t.nom);
      return !stop;
    });
    P.s.vig = Math.min(P.s.vig, eff("vigMax")); P.s.man = Math.min(P.s.man, eff("manMax"));
    return fin.length ? ["Fin de l'effet : " + fin.join(", ")] : [];
  }
  function utiliser(id) {
    var o = L.objets[id] || {}, out = [];
    if (o.effet_stat) out = out.concat(appliquer([{ type: o.effet_stat === "usure" ? "usure" : "stat", stat: o.effet_stat, n: +o.effet_val || 0 }]));
    if (o.temp_stat) {
      P.temp = (P.temp || []).filter(function (t) { return t.id !== id; });
      var t = { id: id, nom: o.nom || "Objet", stat: o.temp_stat, n: +o.temp_val || 0, unite: o.temp_duree || "combat", reste: Math.max(1, +o.temp_n || 1) };
      P.temp.push(t); out.push(tempTxt(t, true));
    }
    if (o.consommable) appliquer([{ type: "retirer", val: id, n: 1 }]);
    return out;
  }
  function effetObjet(o) {
    var out = [];
    if (o.effet_stat) out.push((o.effet_val > 0 ? "+" : "") + (o.effet_val || 0) + " " + (STATS[o.effet_stat] || o.effet_stat));
    if (o.temp_stat) { var n = +o.temp_val || 0, u = o.temp_duree || "combat", k = Math.max(1, +o.temp_n || 1); out.push((n >= 0 ? "+" : "−") + Math.abs(n) + " " + (TEMP_LBL[o.temp_stat] || o.temp_stat) + (u === "combat" ? " jusqu'à la fin du combat" : " pendant " + k + " " + (u === "tours" ? "tour" : "passage") + (k > 1 ? "s" : ""))); }
    return out.join(", ");
  }

  /* Capacité de port */
  function capacite() {
    var base = P.s.cp != null ? +P.s.cp : P.s.for + 3, plus = 0;
    Object.keys(P.inv).forEach(function (id) { var o = L.objets[id]; if (o && +o.bonus_cp) plus += (+o.bonus_cp) * P.inv[id]; });
    return base + plus + bonus("cp");
  }
  function poidsTotal() { var t = 0; Object.keys(P.inv).forEach(function (id) { var o = L.objets[id]; if (o) t += (+o.poids || 0) * P.inv[id]; }); return t; }

  /* Équipement automatique : jamais une arme ou une armure plus faible */
  function moyenneDes(txt) { var d = parseDice(txt); return d[0] * (d[1] + 1) / 2 + d[2]; }
  function equipAuto(id, o) {
    var sl = slotOf(o); if (!sl) return "";
    var cur = P.eq[sl] && P.inv[P.eq[sl]] ? L.objets[P.eq[sl]] : null;
    if (sl === "arme") {
      var base = cur ? cur.arme_degats : (occOf(P.setup.occupation) || {}).degats;
      if (moyenneDes(o.arme_degats || "1d6") >= moyenneDes(base || "1d6")) { P.eq.arme = id; return " · en main"; }
      return " · dans ton sac (ton arme actuelle frappe plus fort)";
    }
    if (sl === "armure") {
      if (!cur || (+o.bonus_armure || 0) + (+o.bonus_parade || 0) > (+cur.bonus_armure || 0) + (+cur.bonus_parade || 0)) { P.eq.armure = id; return " · porté"; }
      return " · dans ton sac (à équiper depuis ta fiche)";
    }
    if (!cur) { P.eq[sl] = id; return " · porté"; }
    return " · dans ton sac (à équiper depuis ta fiche)";
  }
  function secoursLumiere() {
    if (!P.lumOn || (P.s.lum || 0) > 0) return null;
    var id = Object.keys(P.inv).filter(function (k) { var o = L.objets[k]; return o && o.effet_stat === "lum" && P.inv[k] > 0; })
      .sort(function (a, b) { return (+L.objets[b].effet_val || 0) - (+L.objets[a].effet_val || 0); })[0];
    if (!id) return null;
    var nom = L.objets[id].nom; utiliser(id);
    return "Ta lanterne allait s'éteindre : tu y glisses in extremis " + nom + " (Lumière " + P.s.lum + ")";
  }
  function utilisable(o) { return !!(o && (o.effet_stat || o.temp_stat)); }

  function eff(k) {
    if (k === "vigMax") return P.s.vigMax + bonus("vigMax");
    if (k === "manMax") return P.s.manMax + bonus("manMax");
    if (k === "vig" || k === "man") return P.s[k];
    return Math.max(0, (P.s[k] || 0) + bonus(k));
  }
  function slotOf(o) { return o && (o.categorie === "arme" || o.categorie === "armure" || o.categorie === "talisman") ? o.categorie : null; }
  function arme() {
    var o = occOf(P.setup.occupation);
    var w = { nom: o.arme || "Arme", txt: o.degats || "1d6", atk: o.attaque || "for", armure: +o.armure || 0, parade: +o.parade || 0 };
    var a = P.eq.arme && L.objets[P.eq.arme];
    w.fam = o.famille || devineFamille(o.arme);
    if (a && P.inv[P.eq.arme]) { w.nom = a.nom; w.txt = a.arme_degats || w.txt; w.atk = a.arme_attaque || w.atk; w.fam = a.famille || devineFamille(a.nom); }
    w.dmg = parseDice(w.txt);
    equipes().forEach(function (x) { w.armure += +x.bonus_armure || 0; w.parade += +x.bonus_parade || 0; });
    w.armure += tempB("armure"); w.parade += tempB("parade");
    if (tempB("degats")) { w.dmg = w.dmg.slice(); w.dmg[2] += tempB("degats"); w.txt += " " + (tempB("degats") > 0 ? "+" : "−") + Math.abs(tempB("degats")); }
    return w;
  }
  function condOk(c) {
    function cmp(v) { var n = +c.n || 0; return c.op === "<=" ? v <= n : c.op === "==" ? v === n : v >= n; }
    switch (c.type) {
      case "origine": return P.setup.origine === c.val;
      case "occupation": return P.setup.occupation === c.val;
      case "genre": return P.setup.genre === (c.val || "m");
      case "objet": return (P.inv[c.val] || 0) >= (+c.n || 1);
      case "sansobjet": return !(P.inv[c.val] > 0);
      case "mot": return P.mots.indexOf(c.val) >= 0;
      case "info": return P.infos.indexOf(c.val) >= 0;
      case "sansinfo": return P.infos.indexOf(c.val) < 0;
      case "fragment": return (P.frag || []).indexOf(c.val) >= 0 || fragsTrouves().indexOf(c.val) >= 0;
      case "visite": return !!P.vus[c.val];
      case "pasvisite": return !P.vus[c.val];
      case "stat": return cmp(eff(c.stat || "for"));
      case "usure": return cmp(P.usure);
      case "compteur": return cmp(P.compteur);
      case "dispo": var dp = c.val || (P.dial && P.dial.pid); return dp && L.pnj[dp] ? cmp(DLG.mem(dp).disp) : false;
    }
    return true;
  }
  function tousOk(list, ou) { list = list || []; return ou && list.length ? list.some(condOk) : list.every(condOk); }
  function appliquer(list) {
    var out = [];
    (list || []).forEach(function (f) {
      var n = f.n == null ? 1 : +f.n, o;
      if (f.type === "donner" && f.val) {
        P.inv[f.val] = (P.inv[f.val] || 0) + (n || 1); o = L.objets[f.val];
        out.push("+ " + (o ? o.nom : "objet") + (n > 1 ? " ×" + n : "") + (o ? equipAuto(f.val, o) : "") + (o && o.effet_stat === "lum" ? " · à allumer depuis ta fiche" : ""));
      } else if (f.type === "retirer" && f.val) {
        P.inv[f.val] = Math.max(0, (P.inv[f.val] || 0) - (n || 1));
        if (!P.inv[f.val]) { delete P.inv[f.val]; Object.keys(P.eq).forEach(function (k) { if (P.eq[k] === f.val) delete P.eq[k]; }); }
        o = L.objets[f.val]; out.push("− " + (o ? o.nom : "objet") + (n > 1 ? " ×" + n : ""));
        P.s.vig = Math.min(P.s.vig, eff("vigMax")); P.s.man = Math.min(P.s.man, eff("manMax"));
      } else if (f.type === "mot" && f.val && P.mots.indexOf(f.val) < 0) { P.mots.push(f.val); o = L.mots[f.val]; out.push("Mot appris : " + (o ? o.nom : "?")); }
      else if (f.type === "info" && f.val && P.infos.indexOf(f.val) < 0) { P.infos.push(f.val); o = L.infos[f.val]; out.push("Tu sais désormais : " + (o ? o.nom : "?")); }
      else if (f.type === "fragment" && f.val && L.fragments[f.val]) {
        P.frag = P.frag || []; if (P.frag.indexOf(f.val) < 0) P.frag.push(f.val);
        if (fragsTrouves().indexOf(f.val) < 0) { var ft = fragsTrouves(); ft.push(f.val); store(":fragments", ft); out.push("Fragment de lore : " + L.fragments[f.val].nom); UI.fragNouv = (UI.fragNouv || []).concat(f.val); }
      }
      else if (f.type === "oubli" && f.val) P.infos = P.infos.filter(function (x) { return x !== f.val; });
      else if (f.type === "stat") {
        var k = f.stat || "vig", deb = false;
        if (k === "vig") P.s.vig = Math.max(0, Math.min(eff("vigMax"), P.s.vig + n));
        else if (k === "man") P.s.man = Math.max(0, Math.min(eff("manMax"), P.s.man + n));
        else if (k === "lum") { if (n > 0 && debrouillard()) { n += 1; deb = true; } P.s.lum = Math.max(0, Math.min(LUMMAX(), (P.s.lum || 0) + n)); }
        else P.s[k] = Math.max(0, P.s[k] + n);
        out.push((n >= 0 ? "+" : "−") + Math.abs(n) + " " + STATS[k] + (deb ? " (débrouillard)" : ""));
      }
      else if (f.type === "lumiere_on") {
        if (f.n == null && P.lumDeja) { if (!P.lumOn) out.push("Lanterne rallumée : Lumière " + (P.s.lum || 0) + " / " + LUMMAX()); P.lumOn = true; }
        else { P.lumOn = true; P.lumDeja = true; P.s.lum = Math.min(LUMMAX(), f.n == null ? LUMMAX() : Math.max(0, +f.n || 0)); out.push("Lumière : " + P.s.lum + " / " + LUMMAX()); }
      }
      else if (f.type === "lumiere_off") { if (P.lumOn) out.push("Lanterne éteinte : il te reste " + (P.s.lum || 0) + " / " + LUMMAX() + " de lumière"); P.lumOn = false; }
      else if (f.type === "usure") { P.usure += n; out.push("+" + n + " Usure");
      } else if (f.type === "lancer" && f.val) {
        var lm = L.mots[f.val] || {}, cout = +lm.cout || 0, paye = Math.min(cout, P.s.man), reste = cout - paye;
        P.s.man -= paye; P.usure += reste;
        out.push((lm.nom || "Mot") + " prononcé : " + [paye ? "−" + paye + " Mana" : "", reste ? "+" + reste + " Usure" : ""].filter(Boolean).join(", ") + (cout ? "" : "aucun coût"));
