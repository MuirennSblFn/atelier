<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Atelier de Képultum</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya:ital,wght@0,400;0,600;1,400&family=IM+Fell+English+SC&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/dagre/0.8.5/dagre.min.js"></script>
<style>
/* Layout : outil de travail plein écran. Barre d'onglets en haut ; vue Passages en trois colonnes (liste · formulaire · aperçu) ; vue Graphe sur toute la largeur.
   Identité : la pierre de l'abbaye et le vert-de-gris de la thanergie en clair ; la crypte et l'ivoire du palais en sombre. */
:root {
  --bg: #e4e5e8;
  --bg-glow: #f1f1ef;
  --panel: #fbfbf9;
  --panel-2: #f1f2f2;
  --line: #cdd0d6;
  --fg: #1e1c23;
  --muted: #5b5f6c;
  --accent: #33665f;
  --accent-ink: #fbfbf9;
  --accent-soft: #dbe8e5;
  --ivory: #8a6a28;
  --good: #2f7448;
  --warn: #946507;
  --bad: #a63a2b;
  --thane: #33665f;
  --ui: 'Alegreya Sans', 'Segoe UI', system-ui, sans-serif;
  --story: 'Alegreya', 'Iowan Old Style', Georgia, serif;
  --display: 'IM Fell English SC', 'Iowan Old Style', Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131116; --bg-glow: #221c27; --panel: #1b1820; --panel-2: #231f29; --line: #383241; --fg: #e8e1d2; --muted: #9d9486;
    --accent: #84c0b2; --accent-ink: #131116; --accent-soft: #1f3330; --ivory: #dccba4; --good: #93b376; --warn: #d9b55c; --bad: #e27461; --thane: #84c0b2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131116; --bg-glow: #221c27; --panel: #1b1820; --panel-2: #231f29; --line: #383241; --fg: #e8e1d2; --muted: #9d9486;
  --accent: #84c0b2; --accent-ink: #131116; --accent-soft: #1f3330; --ivory: #dccba4; --good: #93b376; --warn: #d9b55c; --bad: #e27461; --thane: #84c0b2;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--ui); font-size: 15px; line-height: 1.45;
  background-image: radial-gradient(ellipse 90% 380px at 50% 0%, var(--bg-glow) 0%, transparent 100%); background-repeat: no-repeat;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 24px;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* ---------- En-tête ---------- */
.top { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 28px; margin-bottom: 14px; padding-top: 4px; }
.brand { font-family: var(--display); font-size: 1.6rem; font-weight: 400; letter-spacing: .02em; color: var(--ivory); line-height: 1; }
.brand small { font-family: var(--ui); font-size: .8rem; font-weight: 500; color: var(--muted); margin-left: 8px; letter-spacing: .06em; text-transform: uppercase; }
nav.tabs { display: flex; flex-wrap: wrap; gap: 0 4px; border-bottom: 1px solid var(--line); }
nav.tabs button { border: 0; background: transparent; padding: 7px 10px 6px; font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
nav.tabs button:hover { color: var(--fg); }
nav.tabs button[aria-current="page"] { color: var(--fg); border-bottom-color: var(--ivory); }
nav.tabs .count { font-size: .75rem; margin-left: 4px; opacity: .8; }
.status { margin-left: auto; font-size: .8rem; color: var(--muted); display: flex; gap: 10px; align-items: center; }
.status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); display: inline-block; margin-right: 5px; }
.status .dot.saving { background: var(--warn); }
.status .dot.err { background: var(--bad); }
.banner { background: var(--accent-soft); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; margin-bottom: 12px; font-size: .85rem; }

/* ---------- Mise en page ---------- */
.cols { display: grid; grid-template-columns: 250px minmax(0, 1fr) minmax(0, 430px); gap: 12px; align-items: start; }
.cols.nopreview { grid-template-columns: 250px minmax(0, 1fr); }
@media (max-width: 1250px) { .cols { grid-template-columns: 230px minmax(0, 1fr); } .cols .side-right { grid-column: 1 / -1; } }
@media (max-width: 760px) { .cols, .cols.nopreview { grid-template-columns: minmax(0, 1fr); } }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; min-width: 0; box-shadow: 0 1px 0 rgba(0,0,0,.03); }
.box-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.box-h h2, .box-h h3 { margin: 0; font-family: var(--display); font-size: 1.2rem; font-weight: 400; letter-spacing: .01em; }
.box-b { padding: 12px; display: flex; flex-direction: column; gap: 12px; }
.sticky { position: sticky; top: 8px; max-height: calc(100vh - 24px); overflow: auto; }

/* ---------- Liste des passages ---------- */
.list-tools { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.plist { list-style: none; margin: 0; padding: 4px; display: flex; flex-direction: column; gap: 1px; }
.plist li button { width: 100%; text-align: left; border: 0; background: transparent; border-radius: 6px; padding: 6px 8px; display: grid; grid-template-columns: 3.2em minmax(0, 1fr) auto; gap: 6px; align-items: center; }
.plist li button:hover { background: var(--panel-2); }
.plist li button[aria-current="true"] { background: var(--accent-soft); }
.plist .num { font-family: var(--display); font-size: 1.05rem; font-variant-numeric: tabular-nums; color: var(--ivory); }
.plist .ttl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.plist .flag { font-size: .7rem; padding: 1px 6px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.plist .flag.ecrit { color: var(--good); border-color: currentColor; }
.plist .flag.relu { color: var(--accent); border-color: currentColor; }
.plist .flag.fin { color: var(--ivory); border-color: currentColor; }
.plist .flag.brouillon { color: var(--warn); border-color: currentColor; }
.plist .grp { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 8px 8px 2px; }
.empty { color: var(--muted); font-size: .88rem; padding: 12px; }

/* ---------- Formulaires ---------- */
label.f { display: flex; flex-direction: column; gap: 4px; font-size: .78rem; font-weight: 600; color: var(--muted); min-width: 0; }
label.f.inline { flex-direction: row; align-items: center; gap: 6px; font-weight: 500; color: var(--fg); font-size: .85rem; }
input[type=text], input[type=number], input[type=search], select, textarea {
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-width: 0; width: 100%;
}
input[type=number] { width: 5.5em; }
textarea { resize: vertical; min-height: 60px; }
textarea.story { font-family: var(--story); font-size: 1.08rem; line-height: 1.65; min-height: 170px; padding: 12px 14px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
.row > .grow { flex: 1 1 160px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr)); gap: 8px; }
.sec { display: flex; flex-direction: column; gap: 8px; }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.sec-h h3 { margin: 0; font-family: var(--display); font-size: 1.02rem; letter-spacing: .03em; color: var(--ivory); font-weight: 400; }
.hint { font-size: .78rem; color: var(--muted); }
.card { border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px; background: var(--panel-2); }
.card.cond { border-left: 3px solid var(--thane); }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 5px 10px; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); color: var(--accent-ink); }
.btn.small { padding: 2px 8px; font-size: .8rem; }
.btn.danger:hover { border-color: var(--bad); color: var(--bad); }
.btn.link { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--panel); padding: 5px 12px; font-weight: 500; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.toolbar { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.mini-rows { display: flex; flex-direction: column; gap: 6px; }
.mini-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.mini-row select, .mini-row input[type=text] { width: auto; flex: 1 1 120px; }
.mini-row .x { border: 0; background: none; color: var(--muted); font-size: 1.1rem; line-height: 1; padding: 2px 6px; }
.mini-row .x:hover { color: var(--bad); }
.confirm { display: inline-flex; gap: 6px; align-items: center; font-size: .82rem; color: var(--bad); }
.thumb { max-width: 100%; max-height: 220px; border-radius: 6px; border: 1px solid var(--line); object-fit: contain; align-self: flex-start; }
.pill { display: inline-block; font-size: .72rem; padding: 1px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }

/* ---------- Aperçu ---------- */
.pv-setup { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 120px), 1fr)); gap: 6px; }
.pv-stats { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.pv-stats b { color: var(--fg); }
.pv-inv { font-size: .8rem; color: var(--muted); }
.pv-page { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.pv-num { text-align: center; font-family: var(--display); font-size: 1.7rem; color: var(--ivory); }
.pv-num::before, .pv-num::after { content: "—"; color: var(--line); margin: 0 .4em; }
.pv-text { font-family: var(--story); font-size: 1.05rem; line-height: 1.65; }
.pv-text p { margin: 0 0 .7em; }
.pv-text .condseg { border-left: 2px solid var(--thane); padding-left: 8px; }
.pv-img { max-width: 100%; border-radius: 6px; }
.pv-fx { font-size: .8rem; color: var(--thane); }
.pv-choice { text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 7px 10px; font-family: var(--story); font-size: 1rem; }
.pv-choice:hover:not(:disabled) { border-color: var(--accent); }
.pv-choice:disabled { opacity: .55; cursor: not-allowed; text-decoration: line-through; }
.pv-reason { font-size: .78rem; color: var(--muted); font-style: italic; margin: -4px 0 2px 10px; }
.pv-end { text-align: center; padding: 8px; }
.pv-end h4 { margin: 0 0 4px; font-family: var(--display); font-weight: 400; font-size: 1.4rem; color: var(--ivory); }
.die { display: inline-flex; align-items: center; justify-content: center; min-width: 1.8em; height: 1.8em; padding: 0 4px; border: 1.5px solid currentColor; border-radius: 4px; font-weight: 700; font-variant-numeric: tabular-nums; margin-right: 4px; }
.ok { color: var(--good); font-weight: 600; }
.ko { color: var(--bad); font-weight: 600; }
.mag { color: var(--thane); }
.cb-intent { font-family: var(--story); font-style: italic; font-size: 1.05rem; border-left: 3px solid var(--ivory); padding: 6px 10px; background: var(--panel); border-radius: 0 6px 6px 0; }
.cb-acts { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 120px), 1fr)); gap: 5px; }
.cb-acts button { text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 5px 8px; font-size: .82rem; }
.cb-acts button:hover:not(:disabled) { border-color: var(--accent); }
.cb-acts button:disabled { opacity: .45; }
.cb-acts small { display: block; color: var(--muted); font-size: .72rem; }
.cb-log { list-style: none; margin: 0; padding: 0; font-size: .8rem; color: var(--muted); display: flex; flex-direction: column; gap: 6px; max-height: 220px; overflow: auto; }
.cb-log li:first-child { color: var(--fg); }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--bad); }

/* ---------- Vérifications ---------- */
.issues { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.issues li { display: grid; grid-template-columns: 6.5em 3.5em minmax(0, 1fr); gap: 8px; align-items: baseline; padding: 6px 8px; border-radius: 6px; background: var(--panel-2); font-size: .85rem; }
.lvl { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
.lvl.erreur { color: var(--bad); }
.lvl.attention { color: var(--warn); }
.kpis { display: flex; flex-wrap: wrap; gap: 8px 24px; font-size: .85rem; color: var(--muted); }
.kpis b { color: var(--fg); font-size: 1.1rem; font-variant-numeric: tabular-nums; margin-right: 4px; }

/* ---------- Catalogues ---------- */
.cat { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 12px; align-items: start; }
@media (max-width: 760px) { .cat { grid-template-columns: minmax(0, 1fr); } }
.tbl-wrap { overflow-x: auto; }
table.mini { border-collapse: collapse; width: 100%; font-size: .85rem; }
table.mini th, table.mini td { border-bottom: 1px solid var(--line); padding: 5px 6px; text-align: left; vertical-align: top; }
table.mini th { font-size: .75rem; color: var(--muted); font-weight: 600; }
table.mini input, table.mini select { width: 100%; }
table.mini input[type=number] { width: 4.5em; }
.graph-tools { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.graph-tools select { width: auto; }
.graph-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .8rem; color: var(--muted); margin-left: auto; }
.graph-legend i { display: inline-block; width: 18px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 4px; }
.graph-legend i.dash { border-top-style: dashed; }
.graph-legend b.sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; border: 1.5px solid; vertical-align: -1px; margin-right: 4px; }
.graph-svg { display: block; width: 100%; touch-action: none; cursor: grab; background: var(--panel-2); border-radius: 0 0 6px 6px; user-select: none; }
.graph-svg.dragging { cursor: grabbing; }
.graph-svg .gn { cursor: pointer; }
.graph-svg .gn:hover rect.card-bg { stroke-width: 2.5; }
.graph-svg text { font-family: var(--ui); }
.graph-svg .gnum { font-family: var(--display); }
.graph-hint { font-size: .8rem; color: var(--muted); padding: 6px 12px 10px; }
.play-wrap { max-width: 780px; margin: 0 auto; }
.cb-overlay { position: fixed; inset: 0; z-index: 50; background: rgba(8, 7, 10, .66); display: flex; align-items: center; justify-content: center; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
.cb-dialog { width: 100%; max-width: 820px; max-height: calc(100vh - 48px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px 22px; box-shadow: 0 24px 70px rgba(0, 0, 0, .5); display: flex; flex-direction: column; gap: 10px; }
.cb-title { margin: 0; font-family: var(--display); font-weight: 400; font-size: 1.5rem; color: var(--ivory); }
.reader .pv-text { font-size: 1.15rem; }
.reader .pv-page { padding: 20px 24px; }
.pick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); gap: 6px; }
.pick { text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 3px; }
.pick span { font-size: .8rem; color: var(--muted); }
.pick[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
details.help { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-size: .85rem; }
details.help summary { cursor: pointer; font-weight: 600; }
details.help code { background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; font-size: .85em; }
</style>

<div class="top">
  <div class="brand">Atelier de Képultum<small>écriture</small></div>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  <div class="status" id="status"><span><span class="dot" id="dot"></span><span id="statusText">Connexion…</span></span></div>
</div>
<div id="banner"></div>
<main id="main"></main>

<script>
(function () {
  "use strict";

  /* =====================================================================
     Données et constantes
     ===================================================================== */
  var STATS = { for: "Force", hab: "Habileté", sag: "Sagesse", vig: "Vigueur", man: "Mana", cha: "Chance" };
  var TEST_STATS = ["for", "hab", "sag", "cha"];
  var INTENTS = { lourd: "Coup lourd", rapides: "Coups rapides", garde: "Garde basse", incant: "Incantation" };
  var STATUTS = { afaire: "À écrire", brouillon: "Brouillon", ecrit: "Écrit", relu: "Relu" };
  var FINS = ["Bonne fin", "Fin douce-amère", "Mauvaise fin", "Fin d'évasion", "Échec", "Mort"];
  var COLS = ["passages", "objets", "mots", "infos", "ennemis"];

  var D = { passages: {}, objets: {}, mots: {}, infos: {}, ennemis: {}, reglages: null };
  var UI = { view: "passages", sel: null, q: "", acte: "tous", catSel: {}, preview: true, confirmDel: false };
  var db = null, assets = null, downloads = null, offline = false, GH = null;
  var loaded = { passages: false, objets: false, mots: false, infos: false, ennemis: false, reglages: false };

  var DEFAULT_REGLAGES = {
    titre: "Aventures en Képultum",
    depart: "",
    base: { for: 12, hab: 12, sag: 11 },
    origines: [],
    occupations: []
  };

  /* =====================================================================
     Outils
     ===================================================================== */
  function h(tag, attrs) {
    var el = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      var v = attrs[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "text") el.textContent = v;
      else if (k === "html") el.innerHTML = v;
      else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), v);
      else if (k === "value") el.value = v;
      else if (k === "checked") el.checked = !!v;
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (var i = 2; i < arguments.length; i++) add(el, arguments[i]);
    return el;
  }
  function add(el, c) {
    if (c === null || c === undefined || c === false) return;
    if (Array.isArray(c)) { c.forEach(function (x) { add(el, x); }); return; }
    el.appendChild(typeof c === "string" || typeof c === "number" ? document.createTextNode(String(c)) : c);
  }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function uid(p) { return (p || "x") + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function rnd(n) { return 1 + Math.floor(Math.random() * n); }
  function parseDice(s) {
    s = String(s || "").replace(/\s/g, "");
    var m = s.match(/^(\d*)d(\d+)([+-]\d+)?$/i);
    if (m) return [parseInt(m[1] || "1", 10), parseInt(m[2], 10), parseInt(m[3] || "0", 10)];
    var n = parseInt(s, 10);
    return [0, 0, isNaN(n) ? 0 : n];
  }
  function roll(spec) { var t = spec[2]; for (var i = 0; i < spec[0]; i++) t += rnd(spec[1]); return t; }
  function lines(s) { return String(s || "").split("\n").map(function (x) { return x.trim(); }).filter(Boolean); }
  function pick(a) { return a.length ? a[Math.floor(Math.random() * a.length)] : ""; }
  function sortedPassages() {
    return Object.keys(D.passages).map(function (id) { return D.passages[id]; }).sort(function (a, b) {
      var na = parseFloat(a.num), nb = parseFloat(b.num);
      if (!isNaN(na) && !isNaN(nb) && na !== nb) return na - nb;
      if (!isNaN(na) && isNaN(nb)) return -1;
      if (isNaN(na) && !isNaN(nb)) return 1;
      return String(a.num || "").localeCompare(String(b.num || ""), "fr", { numeric: true });
    });

      "<p><b>Formes neutres usuelles</b> (il n'existe pas de norme unique ; choisis-en une et garde-la dans tout le livre) : il/elle → <i>iel</i> ; ils/elles → <i>iels</i> ; le/la → <i>lae</i> ; celui/celle → <i>cellui</i> ; ceux/celles → <i>celleux</i> ; lui/elle (après une préposition) → <i>ellui</i> ; un/une → <i>un·e</i> ; mon/ma → <i>mon</i> devant voyelle, sinon <i>man</i> ou <i>mon·a</i>. Le genre neutre peut se désactiver dans les Réglages.</p>",
